# Kjører `npm test` på en ny GitHub-kjører, med de samme stegene som README
# («Start appen» og «Kjør testene»). Brukes når testene ikke kan kjøres lokalt,
# og som en uavhengig kontroll fra en ren klone. Tidene per steg står i
# kjøringen på GitHub (Actions → npm test → jobben).
#
# Starter ved hver pull request mot main (ny, ny commit eller gjenåpnet), ved push
# til en gren som heter ci/... og manuelt (workflow_dispatch). En PR som bare
# endrer docs/ eller .logs/ hoppes over, siden ingen test leser dem. README.md
# leses av seed-login.db.test.ts og utløser derfor en kjøring. Skal kjøringen
# bli et krav for å flette, må paths-ignore fjernes først, ellers blir kravet
# stående ventende på en PR som bare endrer docs/.
# Den bruker ingen hemmeligheter, og KI står på mock (som i .env.example).
# En ny commit på samme PR eller gren avbryter kjøringen som pågår.
name: npm test

on:
  pull_request:
    branches: [main]
    paths-ignore: [".logs/**", "docs/**"]
  push:
    branches: ["ci/**"]
  workflow_dispatch:

concurrency:
  group: npm-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      # Arkitekturreglene (AD-3, AD-16, no-restricted-imports) håndheves av
      # ESLint, og `npm test` kjører den ikke. Billig, så den står først.
      - name: npm run lint
        run: npm run lint

      - name: Start lokal Supabase
        run: npx supabase start

      - name: Kopier .env.example til .env
        run: cp .env.example .env

      - name: Installer nettleseren til Playwright
        run: npx playwright install --with-deps chromium

      - name: npm test
        run: npm test

      - name: Lagre Playwright-rapporten
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
